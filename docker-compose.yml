version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: agenstil-postgres
    environment:
      POSTGRES_USER: agenstil
      POSTGRES_PASSWORD: agenstil
      POSTGRES_DB: agenstil
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenstil"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agenstil-network

  # Redis Cache & Job Queue
  redis:
    image: redis:7-alpine
    container_name: agenstil-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agenstil-network

  # Ollama - LLM + Vision + Embeddings
  ollama:
    image: ollama/ollama:latest
    container_name: agenstil-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    # Uncomment for GPU support (NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agenstil-network
    profiles:
      - with-ai

  # ComfyUI - Image & Video Generation
  comfyui:
    image: comfyui:latest
    build:
      context: ./docker/comfyui
      dockerfile: Dockerfile
    container_name: agenstil-comfyui
    ports:
      - "8188:8188"
    volumes:
      - comfyui_models:/root/ComfyUI/models
      - comfyui_output:/root/ComfyUI/output
    environment:
      COMFYUI_MAX_MEMORY: "4096"
    # Uncomment for GPU
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8188/api/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agenstil-network
    profiles:
      - with-ai

  # pgAdmin - Database Management UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: agenstil-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@agenstil.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - agenstil-network
    profiles:
      - with-admin

  # Redis Commander - Queue Management UI
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: agenstil-redis-commander
    environment:
      REDIS_HOSTS: local:agenstil-redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - agenstil-network
    profiles:
      - with-admin

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  comfyui_models:
  comfyui_output:

networks:
  agenstil-network:
    driver: bridge
